{% extends "base.html" %}
{% block title %}लगइन{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-8">
  <div class="text-center mb-6">
    <div class="text-4xl mb-2">📋</div>
    <h1 class="text-2xl font-bold">चलानी</h1>
    <p class="text-sm opacity-60">कागजको चलानी, डिजिटल दर्ता</p>
  </div>
  <form method="post" class="card bg-base-100 border border-base-300">
    {% csrf_token %}
    <div class="card-body gap-3">
      {% if form.non_field_errors %}<div class="alert alert-error text-sm">{{ form.non_field_errors.0 }}</div>{% endif %}
      {% for field in form %}
        <label class="form-control">
          <span class="label-text text-xs mb-1">{{ field.label }}</span>
          {{ field }}
          {% if field.errors %}<span class="text-error text-xs mt-1">{{ field.errors.0 }}</span>{% endif %}
        </label>
      {% endfor %}
      <button class="btn btn-primary w-full mt-2">लगइन</button>
      <p class="text-center text-sm opacity-70">खाता छैन? <a class="link link-primary" href="{% url 'accounts:signup' %}">दर्ता गर्नुहोस्</a></p>
    </div>
  </form>
</div>
{% endblock %}
