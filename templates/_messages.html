{% if messages %}
  <div class="mb-4 space-y-2">
    {% for message in messages %}
      <div class="alert {% if message.tags == 'error' %}alert-error{% elif message.tags == 'warning' %}alert-warning{% elif message.tags == 'success' %}alert-success{% else %}alert-info{% endif %} py-2">
        <span>{{ message }}</span>
      </div>
    {% endfor %}
  </div>
{% endif %}
