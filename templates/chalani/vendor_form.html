{% extends "base.html" %}
{% block title %}{% if vendor %}{{ vendor }}{% else %}नयाँ आपूर्तिकर्ता{% endif %}{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold mb-4">{% if vendor %}आपूर्तिकर्ता सम्पादन{% else %}नयाँ आपूर्तिकर्ता{% endif %}</h1>
  <form method="post" class="card bg-base-100 border border-base-300">
    {% csrf_token %}
    <div class="card-body grid gap-3 sm:grid-cols-2">
      {% for field in form %}
        <label class="form-control {% if field.name in 'address' %}sm:col-span-2{% endif %}">
          <span class="label-text text-xs mb-1">{{ field.label }}</span>
          {{ field }}
          {% if field.errors %}<span class="text-error text-xs mt-1">{{ field.errors.0 }}</span>{% endif %}
        </label>
      {% endfor %}
      <div class="sm:col-span-2 flex justify-end gap-2">
        <a href="{% url 'chalani:vendor_list' %}" class="btn btn-ghost">रद्द</a>
        <button class="btn btn-primary">सुरक्षित गर्नुहोस्</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
