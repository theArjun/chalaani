name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      # No ANTHROPIC_API_KEY in CI: the extraction tests stub the model.
      CHALAANI_EXTRACTION_ENABLED: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Compile translations
        run: uv run python manage.py compilemessages -l ne --ignore=.venv

      - name: Django system checks
        run: uv run python manage.py check

      - name: Run tests
        run: uv run python manage.py test --verbosity 2
