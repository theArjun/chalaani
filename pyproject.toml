[project]
name = "chalaani"
version = "0.1.0"
description = "Chalani (delivery challan) register SaaS for Nepali businesses"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["nepal", "chalani", "challan", "bikram-sambat", "django", "mcp"]
authors = [
    { name = "thearjun", email = "33110520+theArjun@users.noreply.github.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Nepali",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "django>=6.1",
    "django-htmx>=1.29.0",
    "django-q2>=1.11.1",
    "langchain-anthropic>=1.7.0",
    "mcp>=2.1.1",
    "nepali-datetime>=1.0.8.5",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "whitenoise>=6.12.0",
]

[project.urls]
Homepage = "https://github.com/theArjun/chalaani"
Repository = "https://github.com/theArjun/chalaani"
Issues = "https://github.com/theArjun/chalaani/issues"

[tool.uv]
package = false
